# Socrata Open Data Portals Registry
# Community-maintained catalog/inventory of known Socrata (Tyler Technologies Data & Insights) servers worldwide.
# All entries verified live against /api/catalog/v1 and ROR API v2 (2026-11-23).
#
# Schema:
#   name: Human-readable name of the Socrata portal
#   hostname: Server domain hostname
#   url: Full web catalog URL
#   country_code: Two-letter ISO 3166-1 alpha-2 country code (or null for international/multilateral)
#   description: (Optional) Brief description of the portal
#   custodian: (Optional) Organization responsible for the portal
#     name: Organization name
#     url: Organization home page URL
#     ror: Research Organization Registry (ROR) identifier (when applicable)
#   geocoverage: (Optional) Geographic coverage scope
#     level: Coverage level (global | regional | national | subnational | city | other)
#     description: Description of the coverage region, country, state, or municipality
#     geonames: List of GeoNames URIs (e.g. https://www.geonames.org/...)
#   domains: (Optional) List of domain / topical coverage areas

# ==============================================================================
# International & Multilateral
# ==============================================================================

- name: Water Point Data Exchange (WPDx)
  hostname: data.waterpointdata.org
  url: https://data.waterpointdata.org
  country_code: null
  description: Global repository for sharing water point data from governments, NGOs, and researchers.
  custodian:
    name: Water Point Data Exchange
    url: https://www.waterpointdata.org
  geocoverage:
    level: global
    description: Worldwide
    geonames: []
  domains:
    - water
    - environment
    - international-development

