[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dartfx-socrata"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [{ name = "kulnor", email = "pascal.heus@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "dartfx-dcat>=0.0.1",
  "dartfx-rdf>=0.0.1",
  "jinja2>=3",
  "markdownify>=0.13.0",
  "mlcroissant>=1.0.16",
  "pydantic>=2",
  "requests>=2.25.0",
  "python-dotenv>=1.0.0",
]
[project.urls]
Documentation = "https://github.com/DataArtifex/socrata-toolkit#readme"
Issues = "https://github.com/DataArtifex/socrata-toolkit/issues"
Source = "https://github.com/DataArtifex/socrata-toolkit"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/dartfx"]

[tool.hatch.version]
path = "src/dartfx/socrata/__about__.py"

[tool.hatch.build.targets.wheel.force-include]
"src/dartfx/socrata/py.typed" = "dartfx/socrata/py.typed"

[dependency-groups]
dev = [
  "coverage[toml]>=6.5",
  "pytest>=9",
  "lxml>=5.0.0",
  "pytest-benchmark>=4.0.0",
  "mypy>=1.0.0",
  "python-dotenv>=1.0.0",
  "ruff>=0.3.0",
  "pre-commit>=3.0.0",
]
docs = ["sphinx>=8.0.0", "sphinx_rtd_theme>=3.0.0", "myst_parser>=4.0.0"]


[tool.hatch.envs.default]
dependencies = ["dev"]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = ["- coverage combine", "coverage report"]
cov = ["test-cov", "cov-report"]

[[tool.hatch.envs.all.matrix]]
python = ["3.12", "3.13"]

[tool.hatch.envs.types]
dependencies = ["dev"]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/dartfx/socrata tests}"

[tool.hatch.envs.docs]
dependencies = ["docs"]
[tool.hatch.envs.docs.scripts]
build = "sphinx-build -b html docs/source docs/build/html"
serve = "python -m http.server -d docs/build/html"

[tool.hatch.metadata]
allow-direct-references = true

[tool.coverage.run]
source_pkgs = ["socrata", "tests"]
branch = true
parallel = true
omit = ["src/dartfx/socrata/__about__.py"]

[tool.coverage.paths]
source = ["src/dartfx/socrata", "*/socrata-toolkit/src/dartfx/socrata"]
tests = ["tests", "*/dartfx/socrata/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
no_implicit_optional = false
exclude = ["^tests/sfo_311_python-pandas\\.py$"]

[[tool.mypy.overrides]]
module = ["dartfx.dcat.*", "mlcroissant", "sodapy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dartfx.socrata.*"]
disable_error_code = ["arg-type", "call-arg", "index", "return", "union-attr"]

[[tool.mypy.overrides]]
module = ["tests.test_ddic"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG", # flake8-unused-arguments
  "PT",  # flake8-pytest-style
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["dartfx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
